<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { surface: { DEFAULT:'#0d0d14', raised:'#13131e', overlay:'#1a1a28', border:'rgba(255,255,255,0.08)' },
             accent: { DEFAULT:'#5b8af5', glow:'rgba(91,138,245,0.25)' } },
  fontFamily: { sans: ['Inter','system-ui','sans-serif'] }
}}};
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { background:#000; color:#fff; font-family:Inter,system-ui,sans-serif; }
  .glass { background:rgba(255,255,255,0.04); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.08); }
  .anno { position:absolute; width:20px; height:20px; border-radius:9999px; background:#5b8af5; color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 3px rgba(91,138,245,.35); z-index:50; }
</style>
</head>
<body class="antialiased">
<div class="fixed inset-0 bg-black flex flex-col">
  <!-- video area -->
  <div class="absolute inset-0" style="background:radial-gradient(ellipse at 50% 45%, #101a2e 0%, #05070d 65%)">
    <div class="absolute inset-0 flex items-center justify-center">
      <div class="text-center opacity-40">
        <p class="text-6xl font-black italic tracking-tight text-white/10">NFL</p>
        <p class="text-xs font-bold tracking-[.4em] text-white/20 uppercase mt-2">Week 11 &middot; Sunday Night Football</p>
      </div>
    </div>
  </div>

  <!-- overlay chrome -->
  <div class="relative z-10 flex flex-col justify-between h-full p-6" style="background:linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.8) 100%)">
    <!-- top bar -->
    <div class="flex items-center justify-between">
      <div>
        <p class="text-xs font-semibold tracking-widest text-white/50 uppercase mb-0.5">CBS</p>
        <p class="text-2xl font-bold">11.1 K30JMD1</p>
      </div>
      <button class="w-10 h-10 rounded-full glass flex items-center justify-center">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
    </div>

    <!-- bottom -->
    <div class="flex flex-col gap-4">
      <!-- NEW: now-playing bar -->
      <div class="relative max-w-3xl w-full mx-auto rounded-xl glass px-5 py-4">
        <div class="flex items-center justify-between mb-2">
          <p class="text-sm font-bold text-white/90 truncate">NFL Football</p>
          <p class="text-[10px] font-bold text-white/30 uppercase tracking-widest shrink-0 ml-4">Started 7:00 PM</p>
        </div>
        <p class="text-xs text-white/40 line-clamp-1 mb-3">Week 11: Sunday Night Football. Full game coverage with live scoring and instant replay.</p>
        <div class="h-1 w-full bg-white/10 rounded-full overflow-hidden">
          <div class="h-full bg-accent" style="width:42%"></div>
        </div>
        <div class="flex justify-between mt-1.5 text-[10px] font-medium text-white/30 tabular-nums">
          <span>1:27:00</span>
          <span>3:25:00</span>
        </div>
        <span class="anno" style="top:-10px;right:-10px">2</span>
      </div>

      <!-- controls row -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-2 h-2 rounded-full bg-red-500"></div>
          <span class="text-sm font-medium text-white/80">LIVE</span>
          <span class="relative inline-flex items-center gap-1.5 rounded-full bg-accent/20 border border-accent/40 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-accent">
            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8a2 2 0 00-2 2v18a2 2 0 002 2h8a2 2 0 002-2V8.5L14 2.5a2 2 0 00-2-2h-1.5z" /></svg>
            Transcoding
            <span class="anno" style="position:absolute;top:-10px;right:-10px">1</span>
          </span>
        </div>
        <div class="flex items-center gap-2">
          <button class="w-9 h-9 rounded-lg glass flex items-center justify-center">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /><path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" /></svg>
          </button>
          <button class="w-9 h-9 rounded-lg glass flex items-center justify-center">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" /></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
